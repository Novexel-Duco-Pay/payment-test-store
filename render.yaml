services:
  - type: web
    name: payment-test-store-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DUCO_MERCHANT_KEY
        sync: false
      - key: DUCO_WEBHOOK_SECRET
        sync: false
      - key: DUCO_API_BASE
        value: https://api-staging.ducopay.com
      - key: APP_ORIGIN
        sync: false

  - type: web
    name: payment-test-store
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
